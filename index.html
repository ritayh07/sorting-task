<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>員工內隱離職傾向測驗</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --concept-color: #0f766e;   /* 概念類別顏色（深青綠） */
      --attribute-color: #7c3aed; /* 屬性類別顏色（深紫） */
      --danger: #dc2626;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 780px;
      min-height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    @media (min-width: 781px) {
      .container {
        min-height: 620px;
        border-radius: 12px;
        margin: 20px;
      }
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--primary);
    }

    .progress-badge {
      font-size: 0.85rem;
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .intro-box {
      max-width: 520px;
      width: 100%;
      text-align: left;
    }

    .intro-box p {
      line-height: 1.6;
      color: #374151;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      user-select: text;
      -webkit-user-select: text;
    }

    .radio-group {
      display: flex;
      gap: 16px;
    }

    .radio-option {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .radio-option input {
      accent-color: var(--primary);
      transform: scale(1.2);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .instruction-card {
      max-width: 560px;
      width: 100%;
    }

    .category-preview {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0;
    }

    .preview-side {
      flex: 1;
      background: #f9fafb;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 12px;
    }

    .preview-side .key-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .cat-tag {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .cat-concept { color: var(--concept-color); }
    .cat-attribute { color: var(--attribute-color); }

    .test-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .top-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 8px;
    }

    .side-header {
      width: 46%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .side-header .key-badge {
      display: inline-block;
      font-size: 0.8rem;
      background: #e2e8f0;
      color: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stimulus-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .stimulus-word {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 12px 0;
    }

    .error-feedback {
      height: 36px;
      color: var(--danger);
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .response-buttons {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-top: 16px;
    }

    .resp-btn {
      flex: 1;
      height: 84px;
      font-size: 1.25rem;
      font-weight: 700;
      border: 2px solid var(--primary);
      background: #eff6ff;
      color: var(--primary);
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .resp-btn:active {
      background: var(--primary);
      color: #ffffff;
    }

    .resp-btn span.sub-key {
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 4px;
    }

    .end-card {
      max-width: 480px;
      width: 100%;
    }

    .end-card h2 {
      color: var(--primary);
      margin-bottom: 12px;
    }

    .status-msg {
      margin: 16px 0;
      padding: 12px;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 0.95rem;
      color: #374151;
    }

    .btn-download {
      margin-top: 16px
